<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{background:#0f0f1a;color:#eaeaea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(227,53,13,.07) 0,transparent 50%),radial-gradient(circle at 80% 80%,rgba(43,109,181,.07) 0,transparent 50%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 14px 100px;}
header{text-align:center;padding:max(env(safe-area-inset-top),20px) 0 14px;}
.ball{font-size:44px;filter:drop-shadow(0 0 16px rgba(227,53,13,.6));margin-bottom:6px;}
h1{font-family:'Courier New',monospace;font-weight:900;font-size:clamp(14px,4vw,22px);color:#FFD700;text-shadow:3px 3px 0 #E3350D;letter-spacing:1px;line-height:1.3;}
.sub-title{color:#8899bb;font-size:12px;margin-top:5px;}
.progress-box{background:#16213e;border:1px solid rgba(255,215,0,.2);border-radius:14px;padding:14px 16px;margin:14px 0;}
.prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.prog-label{font-weight:800;font-size:13px;}
.prog-num{font-family:monospace;font-weight:900;color:#FFD700;font-size:13px;}
.prog-bar-bg{background:rgba(255,255,255,.08);border-radius:8px;height:10px;overflow:hidden;}
.prog-bar{height:100%;background:linear-gradient(90deg,#E3350D,#FFD700);border-radius:8px;transition:width .4s;}
.prog-stats{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap;}
.prog-stat{font-size:11px;color:#8899bb;}
.prog-stat b{font-weight:800;}
.filters{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
.filter-btn{padding:6px 13px;border-radius:18px;border:2px solid rgba(255,255,255,.15);background:transparent;color:#8899bb;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;}
.filter-btn.active{background:#FFD700;border-color:#FFD700;color:#000;}
.era{margin-bottom:20px;}
.era-head{display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:12px;cursor:pointer;user-select:none;border:1px solid transparent;}
.era-icon{font-size:20px;}
.era-info{flex:1;}
.era-lbl{font-weight:900;font-size:13px;}
.era-yr{font-size:10px;color:#8899bb;margin-top:1px;}
.era-cnt{font-size:11px;font-weight:800;padding:2px 9px;border-radius:9px;white-space:nowrap;}
.era-arrow{color:#8899bb;font-size:15px;transition:transform .2s;flex-shrink:0;}
.era-arrow.open{transform:rotate(90deg);}
.items{display:flex;flex-direction:column;gap:5px;padding-left:2px;margin-top:8px;}
.item-row{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:10px;cursor:pointer;user-select:none;transition:all .18s;border:1px solid rgba(255,255,255,.07);background:#16213e;}
.item-row.complete{background:rgba(46,204,113,.07);border-color:rgba(46,204,113,.3);box-shadow:-3px 0 0 #2ECC71;}
.item-row.open-item{border-radius:10px 10px 0 0;}
.chk{width:20px;height:20px;border-radius:5px;border:2px solid rgba(255,255,255,.2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;}
.chk.done{background:#2ECC71;border-color:#2ECC71;}
.chk span{color:#000;font-weight:900;font-size:12px;}
.ring-wrap{position:relative;width:26px;height:26px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:900;}
.item-em{font-size:16px;flex-shrink:0;}
.item-body{flex:1;min-width:0;}
.item-title{font-weight:800;font-size:13px;line-height:1.3;}
.item-title.done{text-decoration:line-through;color:#8899bb;}
.item-sub{font-size:11px;color:#8899bb;margin-top:2px;line-height:1.4;}
.item-note-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:3px;}
.item-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;}
.item-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
.item-count{font-size:11px;color:#8899bb;font-weight:700;}
.ep-panel{background:#0d1526;border:1px solid rgba(255,255,255,.07);border-top:none;border-radius:0 0 10px 10px;padding:10px 12px 12px;}
.ep-actions{display:flex;gap:7px;margin-bottom:9px;}
.ep-btn{font-size:11px;font-weight:800;padding:4px 11px;border-radius:7px;border:none;cursor:pointer;font-family:inherit;}
.ep-btn.mark{background:rgba(46,204,113,.2);color:#2ECC71;}
.ep-btn.rst{background:rgba(255,255,255,.07);color:#8899bb;}
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;}
.ep-item{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:7px;cursor:pointer;user-select:none;transition:all .15s;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);}
.ep-item.done{background:rgba(46,204,113,.09);border-color:rgba(46,204,113,.3);}
.ep-chk{width:14px;height:14px;border-radius:3px;border:2px solid rgba(255,255,255,.2);background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.ep-chk.done{background:#2ECC71;border-color:#2ECC71;}
.ep-chk span{color:#000;font-weight:900;font-size:9px;}
.ep-lbl{font-size:11px;font-weight:600;color:#8899bb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ep-lbl.done{color:#2ECC71;}
.footer-tip{background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.2);border-radius:12px;padding:13px 15px;margin-top:10px;font-size:12px;line-height:1.8;}
</style>

  {id:"e59",era:9,icon:"🎨",type:"short",tl:"KISA",title:"Pokémon: Evolutions",sub:"25. yıl dönümü — tüm bölgelerden sahneler",note:"optional",nl:"💜 Opsiyonel",episodes:["The Champion","The Rival","The Visionary","The Plan","The Show","The Wave","The Wish","The Discovery"]},
  {id:"e60",era:9,icon:"🏨",type:"spinoff",tl:"SPIN-OFF",title:"Pokémon Concierge",sub:"Netflix stop-motion — Pokémon tatil köyü",note:"optional",nl:"💜 Opsiyonel",episodes:["Bölüm 1","Bölüm 2","Bölüm 3","Bölüm 4"]},
  {id:"e61",era:9,icon:"🕵️",type:"film",tl:"FİLM",title:"Detective Pikachu (Canlı Film)",sub:"2019 — Ryan Reynolds, tamamen ayrı evren",note:"alt",nl:"⚡ Farklı evren",episodes:["Film (2019)"]},
  {id:"e62",era:9,icon:"🎬",type:"film",tl:"FİLM",title:"Mewtwo Strikes Back: Evolution (CGI)",sub:"The First Movie CGI yeniden yapımı — Netflix",note:"alt",nl:"⚡ Yeniden yapım",episodes:["Film (2019)"]},
];
const TS={series:{bg:"rgba(43,109,181,.2)",color:"#60aaff",border:"rgba(43,109,181,.4)"},film:{bg:"rgba(227,53,13,.2)",color:"#ff7755",border:"rgba(227,53,13,.4)"},special:{bg:"rgba(155,89,182,.2)",color:"#c39bd3",border:"rgba(155,89,182,.4)"},short:{bg:"rgba(46,204,113,.2)",color:"#7dcea0",border:"rgba(46,204,113,.4)"},spinoff:{bg:"rgba(230,126,34,.2)",color:"#f0b27a",border:"rgba(230,126,34,.4)"}};
const NS={canon:{bg:"rgba(46,204,113,.15)",color:"#2ECC71"},optional:{bg:"rgba(155,89,182,.15)",color:"#c39bd3"},alt:{bg:"rgba(255,215,0,.12)",color:"#FFD700"},new:{bg:"rgba(227,53,13,.15)",color:"#ff7755"}};

const SK="pk-v2";
let checked={};
let openItem=null;
let openEras=Object.fromEntries(ERAS.map(e=>[e.id,true]));
let curFilter="all";

function save(){try{localStorage.setItem(SK,JSON.stringify(checked));}catch(e){}}
function load(){try{const d=localStorage.getItem(SK);if(d)checked=JSON.parse(d);}catch(e){}}
function epk(id,i){return id+"__"+i;}
function itemDone(it){return it.episodes.filter((_,i)=>checked[epk(it.id,i)]).length;}
function itemFull(it){return itemDone(it)===it.episodes.length;}
function eraVis(id){if(curFilter==="ash")return id>=1&&id<=7;if(curFilter==="spinoff")return id===9;if(curFilter==="new")return id===8;return true;}
function itVis(it){if(curFilter==="film")return it.type==="film";return true;}

function updateProgress(){
  const totalEps=ITEMS.reduce((s,it)=>s+it.episodes.length,0);
  const doneEps=ITEMS.reduce((s,it)=>s+itemDone(it),0);
  const pct=totalEps?Math.round(doneEps/totalEps*100):0;
  document.getElementById("prog-text").textContent=doneEps+"/"+totalEps+" ("+pct+"%)";
  document.getElementById("prog-bar").style.width=pct+"%";
  document.getElementById("stat-items").textContent=ITEMS.filter(it=>itemFull(it)).length+"/"+ITEMS.length;
  const films=ITEMS.filter(it=>it.type==="film");
  document.getElementById("stat-films").textContent=films.filter(it=>itemFull(it)).length+"/"+films.length;
}

function renderFilters(){
  const defs=[{k:"all",l:"Tümü"},{k:"ash",l:"🎩 Ash Dönemi"},{k:"film",l:"🎬 Filmler"},{k:"spinoff",l:"✨ Spin-off"},{k:"new",l:"🆕 Yeni Nesil"}];
  document.getElementById("filters").innerHTML=defs.map(f=>`<button class="filter-btn${f.k===curFilter?" active":""}" data-f="${f.k}">${f.l}</button>`).join("");
  document.querySelectorAll(".filter-btn").forEach(b=>b.addEventListener("click",()=>{curFilter=b.dataset.f;render();}));
}

function ringHTML(done,total,color){
  const C=2*Math.PI*11,off=C*(1-done/total),full=done===total;
  return `<div class="ring-wrap"><svg width="26" height="26"><circle cx="13" cy="13" r="11" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/><circle cx="13" cy="13" r="11" fill="none" stroke="${full?"#2ECC71":color}" stroke-width="3" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="ring-center" style="color:${full?"#2ECC71":"#eaeaea"}">${full?"✓":done}</div></div>`;
}

function renderItem(it,era){
  const done=itemDone(it),total=it.episodes.length,full=done===total,isOpen=openItem===it.id,single=total===1;
  const ts=TS[it.type]||TS.series,ns=it.note?NS[it.note]:null;
  const chk=single?`<div class="chk${full?" done":""}" data-si="${it.id}" data-ep="0">${full?"<span>✓</span>":""}</div>`:ringHTML(done,total,era.color);
  return `<div id="w${it.id}">
    <div class="item-row${full?" complete":""}${isOpen?" open-item":""}" data-id="${it.id}" data-single="${single?1:0}">
      ${chk}
      <span class="item-em">${it.icon}</span>
      <div class="item-body">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-bottom:2px;">
          <span class="item-title${full?" done":""}">${it.title}</span>
          <span class="item-tag" style="background:${ts.bg};color:${ts.color};border:1px solid ${ts.border}">${it.tl}</span>
        </div>
        <div class="item-sub">${it.sub}</div>
        ${ns&&it.nl?`<span class="item-note-badge" style="background:${ns.bg};color:${ns.color}">${it.nl}</span>`:""}
      </div>
      ${!single?`<div class="item-right"><span class="item-count">${done}/${total}</span><span class="era-arrow${isOpen?" open":""}">›</span></div>`:""}
    </div>
    ${isOpen&&!single?`<div class="ep-panel">
      <div class="ep-actions">
        <button class="ep-btn mark" data-ma="${it.id}">✓ Tümünü işaretle</button>
        <button class="ep-btn rst" data-rs="${it.id}">× Sıfırla</button>
      </div>
      <div class="ep-grid">${it.episodes.map((e,i)=>{const k=epk(it.id,i),d=!!checked[k];return`<div class="ep-item${d?" done":""}" data-ei="${it.id}" data-ep="${i}"><div class="ep-chk${d?" done":""}">${d?"<span>✓</span>":""}</div><span class="ep-lbl${d?" done":""}">${e}</span></div>`;}).join("")}</div>
    </div>`:""}
  </div>`;
}

function render(){
  renderFilters();
  let html="";
  ERAS.forEach(era=>{
    if(!eraVis(era.id))return;
    const items=ITEMS.filter(it=>it.era===era.id&&itVis(it));
    if(!items.length)return;
    const et=items.reduce((s,it)=>s+it.episodes.length,0),ed=items.reduce((s,it)=>s+itemDone(it),0),open=openEras[era.id];
    html+=`<div class="era"><div class="era-head" data-era="${era.id}" style="background:${era.color}14;border-left:4px solid ${era.color};border:1px solid ${era.color}33;border-left:4px solid ${era.color};">
      <span class="era-icon">${era.icon}</span>
      <div class="era-info"><div class="era-lbl" style="color:${era.color}">${era.label}</div><div class="era-yr">${era.years}</div></div>
      <span class="era-cnt" style="background:${era.color}22;color:${era.color}">${ed}/${et}</span>
      <span class="era-arrow${open?" open":""}">›</span>
    </div>${open?`<div class="items">${items.map(it=>renderItem(it,era)).join("")}</div>`:""}</div>`;
  });
  document.getElementById("content").innerHTML=html;
  bind();
  updateProgress();
}

function bind(){
  document.querySelectorAll(".era-head").forEach(el=>el.addEventListener("click",()=>{const id=+el.dataset.era;openEras[id]=!openEras[id];render();}));
  document.querySelectorAll(".item-row").forEach(el=>el.addEventListener("click",e=>{
    if(e.target.closest("[data-si]"))return;
    if(el.dataset.single==="1")return;
    openItem=openItem===el.dataset.id?null:el.dataset.id;render();
  }));
  document.querySelectorAll("[data-si]").forEach(el=>el.addEventListener("click",e=>{
    e.stopPropagation();
    const k=epk(el.dataset.si,+el.dataset.ep);
    checked[k]=!checked[k];if(!checked[k])delete checked[k];save();render();
  }));
  document.querySelectorAll("[data-ei]").forEach(el=>el.addEventListener("click",()=>{
    const k=epk(el.dataset.ei,+el.dataset.ep);
    checked[k]=!checked[k];if(!checked[k])delete checked[k];save();
    const it=ITEMS.find(i=>i.id===el.dataset.ei);
    if(it&&itemFull(it))openItem=null;
    render();
  }));
  document.querySelectorAll("[data-ma]").forEach(el=>el.addEventListener("click",()=>{
    const it=ITEMS.find(i=>i.id===el.dataset.ma);if(!it)return;
    it.episodes.forEach((_,i)=>{checked[epk(it.id,i)]=true;});
    openItem=null;save();render();
  }));
  document.querySelectorAll("[data-rs]").forEach(el=>el.addEventListener("click",()=>{
    const it=ITEMS.find(i=>i.id===el.dataset.rs);if(!it)return;
    it.episodes.forEach((_,i)=>{delete checked[epk(it.id,i)];});
    save();render();
  }));
}

load();render();
</script>
</body>
</html>
